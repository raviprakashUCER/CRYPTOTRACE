[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-log = "2"
identity-service = { path = "../../../services/identity-service" }
document-service = { path = "../../../services/document-service" }
forensics-service = { path = "../../../services/forensics-service" }
ledger-service = { path = "../../../services/ledger-service" }
ledger-core = { path = "../../../packages/ledger-core" }
storage-sqlite = { path = "../../../packages/storage-sqlite" }
watermark-core = { path = "../../../packages/watermark-core" }
crypto-core = { path = "../../../packages/crypto-core" }
bincode = "1.3"
rs_merkle = "1.4"
hex = "0.4"
