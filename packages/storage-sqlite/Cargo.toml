[package]
name = "storage-sqlite"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
identity-core = { path = "../identity-core" }
ledger-core = { path = "../ledger-core" }
rs_merkle = "1.4"
hex = "0.4"
bincode = "1.3"
