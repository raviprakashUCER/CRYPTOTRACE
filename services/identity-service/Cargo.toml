[package]
name = "identity-service"
version = "0.1.0"
edition = "2021"

[dependencies]
identity-core = { path = "../../packages/identity-core" }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
storage-sqlite = { path = "../../packages/storage-sqlite" }
crypto-core = { path = "../../packages/crypto-core" }

[dev-dependencies]
pqcrypto-kyber = "0.8"
pqcrypto-dilithium = "0.4"
pqcrypto-traits = "0.3"
