[package]
name = "ledger-service"
version = "0.1.0"
edition = "2021"

[dependencies]
ledger-core = { path = "../../packages/ledger-core" }
forensics-service = { path = "../../services/forensics-service" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
bincode = "1.3"
hex = "0.4"
rs_merkle = "1.4"
uuid = { version = "1.8", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
storage-sqlite = { path = "../../packages/storage-sqlite" }

[dev-dependencies]
identity-core = { path = "../../packages/identity-core" }
pqcrypto-traits = "0.3"
